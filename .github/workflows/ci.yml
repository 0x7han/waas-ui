name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build-time constraint: tsdown 0.23 requires Node ^22.18 || ^24.11 || >=26
  # to RUN (research docs/research/npm-packaging.md §4.3). Output target stays
  # compatible — the packed tarball is smoke-tested on 18/20/22 below.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npx publint
      - run: npx attw --pack .

  smoke:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build --ignore-scripts || npm run build
      - run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          DIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$DIR"
          node --input-type=module -e "import('waas-ui', { with: { }).catch?.(() => {})" 2>/dev/null || true
          node --input-type=module -e "import { WAAS_UI_VERSION } from '$DIR/package/dist/index.js'; if (WAAS_UI_VERSION !== '0.1.0') throw new Error('bad ESM version');"
          node -e "const m = require('$DIR/package/dist/index.cjs'); if (m.WAAS_UI_VERSION !== '0.1.0') throw new Error('bad CJS version');"
          rm -rf "$DIR" "$TARBALL"
