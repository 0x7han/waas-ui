name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build-time constraint: tsdown 0.23 requires Node ^22.18 || ^24.11 || >=26
  # to RUN (research docs/research/npm-packaging.md §4.3). Output target stays
  # compatible — the packed tarball is smoke-tested on 18/20/22 below.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npx publint
      - run: npx attw --pack . --profile node16 --entrypoints . ./button ./form ./selection ./navigation ./overlay ./data

  smoke:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
      - run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TARBALL=$(npm pack --silent | tail -n 1)
          DIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$DIR"
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$DIR/node_modules"
          node --input-type=module -e "import { WAAS_UI_VERSION } from '$DIR/package/dist/index.js'; if (WAAS_UI_VERSION !== '$PKG_VERSION') throw new Error('bad ESM version');"
          node -e "const m = require('$DIR/package/dist/index.cjs'); if (m.WAAS_UI_VERSION !== '$PKG_VERSION') throw new Error('bad CJS version');"
          test -f "$DIR/package/dist/tokens.css" && test -f "$DIR/package/dist/theme.css"
          rm -rf "$DIR" "$TARBALL"
